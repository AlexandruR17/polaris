[project]
name = "polaris-gs"
version = "1.0.0"
description = "POLARIS Ground Station: web dashboard and reference model for POLARIS SAT-1"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "numpy>=1.24", "pyserial>=3.5", "skyfield>=1.46", "sgp4>=2.22"]

[project.optional-dependencies]
dev = ["pytest>=7", "schemdraw>=0.18", "matplotlib>=3.7", "playwright>=1.40"]

[tool.setuptools.packages.find]
include = ["polaris_gs*"]

[tool.setuptools.package-data]
polaris_gs = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/**/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
