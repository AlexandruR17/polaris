; POLARIS SAT-1 firmware
; esp32dev_sim : build for Wokwi (limit switches simulated, default)
; esp32dev_hw  : build for the real pedestal (real limit switches)
; esp32dev_qemu: smoke test in Espressif QEMU (no WiFi radio there)

[platformio]
default_envs = esp32dev_sim

[env]
; pioarduino: Arduino-ESP32 core 3.x (same core as wokwi.com)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; 3 MB application partition (WiFi + TLS + displays need > 1.2 MB).
; pioarduino also writes firmware.factory.bin (bootloader + partitions +
; app), which is the image wokwi.toml loads.
board_build.partitions = huge_app.csv
extra_scripts = post:lib_flags.py
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    https://github.com/waspinator/AccelStepper.git#1.64
    https://github.com/olikraus/U8g2_Arduino.git#2.37.1
    https://github.com/johnrickman/LiquidCrystal_I2C.git#1.1.3
    https://github.com/adafruit/Adafruit_BusIO.git#1.17.4
    https://github.com/adafruit/Adafruit_Sensor.git#1.1.15
    ; declared dependencies of Adafruit MPU6050 (only its examples use them)
    https://github.com/adafruit/Adafruit-GFX-Library.git#1.12.6
    https://github.com/adafruit/Adafruit_SSD1306.git#2.5.17
    https://github.com/adafruit/Adafruit_MPU6050.git#2.2.9

[env:esp32dev_sim]
build_flags =
    ${env.build_flags}
    -DPOLARIS_SIMULATION=1

[env:esp32dev_hw]
build_flags =
    ${env.build_flags}
    -DPOLARIS_SIMULATION=0

[env:esp32dev_qemu]
build_flags =
    ${env.build_flags}
    -DPOLARIS_SIMULATION=1
    -DPOLARIS_QEMU=1
    -DCORE_DEBUG_LEVEL=0
